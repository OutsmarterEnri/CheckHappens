name: Deploy Check Happens to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and build
        run: |
          npm ci
          npm run check
      - name: Verify browser interactions
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Preserve browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-failure-details
          path: test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

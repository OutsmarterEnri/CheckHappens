<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff3d9" />
    <meta
      name="description"
      content="Chess meets cards. Pass and play, or train with three bots."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Check Happens." />
    <link rel="preload" as="image" href="./brand/mascot-sheet.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link
      rel="apple-touch-icon"
      href="./icons/apple-touch-icon.png?v=owner-mascot"
    />
    <title>Check Happens. — In Cards we trust</title>
    <script>
      // Apply the saved canvas before CSS/React: iOS can sample it at launch.
      const checkHappensLaunchColors = {
        candy: "#fff3d9",
        mint: "#102f2c",
        bubblegum: "#ffe5ef",
        peach: "#ffdbb3",
        cloud: "#e8f3ff",
        halloween: "#1d142b",
      };
      let checkHappensLaunchTheme = "candy";
      try {
        const saved = JSON.parse(localStorage.getItem("check-happens-theme"));
        if (Object.hasOwn(checkHappensLaunchColors, saved))
          checkHappensLaunchTheme = saved;
      } catch {}
      const checkHappensLaunchColor =
        checkHappensLaunchColors[checkHappensLaunchTheme];
      document.documentElement.dataset.theme = checkHappensLaunchTheme;
      document.documentElement.style.setProperty(
        "--launch-background",
        checkHappensLaunchColor,
      );
      document.querySelector('meta[name="theme-color"]').content =
        checkHappensLaunchColor;
    </script>
    <style>
      html {
        background: var(--app-background, var(--launch-background, #fff3d9));
      }
      .boot-splash {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--app-background, var(--launch-background, #fff3d9));
        color: var(--ink, #322546);
        font-family:
          "SF Pro Rounded",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      .boot-splash img {
        width: 144px;
        height: 144px;
        padding: 10px;
        border: 1px solid var(--edge, #bba1d3);
        border-radius: 32px;
        background: var(--paper, var(--launch-background, #fff3d9));
        box-shadow: 0 7px 0 var(--edge, #bba1d3);
        margin-bottom: 8px;
      }
      .boot-splash::after {
        content: "";
        width: 64px;
        height: 4px;
        border-radius: 8px;
        background: var(--purple, #7952c3);
      }
      @supports (-webkit-touch-callout: none) {
        .boot-splash {
          font-family:
            ui-rounded,
            -apple-system,
            system-ui,
            sans-serif;
        }
      }
      .boot-splash strong {
        font-size: 30px;
      }
      .boot-splash span {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status">
        <img src="./brand/mascot-main.png" alt="" /><strong
          >Check Happens.</strong
        ><span>In Cards we trust</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

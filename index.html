<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff3d9" />
    <meta
      name="description"
      content="Chess meets cards. Pass and play, or train with three bots."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Check Happens." />
    <link rel="preload" as="image" href="./brand/mascot-sheet.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link
      rel="apple-touch-icon"
      href="./icons/apple-touch-icon.png?v=owner-mascot"
    />
    <title>Check Happens. — In Cards we trust</title>
    <script>
      try {
        const checkHappensTheme = JSON.parse(
          localStorage.getItem("check-happens-theme") || '"candy"',
        );
        if (
          [
            "candy",
            "mint",
            "bubblegum",
            "peach",
            "cloud",
            "halloween",
          ].includes(checkHappensTheme)
        )
          document.documentElement.dataset.theme = checkHappensTheme;
      } catch {}
    </script>
    <style>
      .boot-splash {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--app-background, #fff3d9);
        color: var(--ink, #322546);
        font-family: ui-rounded, system-ui, sans-serif;
      }
      .boot-splash img {
        width: 128px;
        height: 128px;
      }
      .boot-splash strong {
        font-size: 30px;
      }
      .boot-splash span {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status">
        <img src="./brand/mascot-main.png" alt="" /><strong
          >Check Happens.</strong
        ><span>In Cards we trust</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
